[package]
name = "coldstoreapp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "coldstoreapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
serialport = "4.2"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
tauri-plugin-process = "2"
# Vendored fork of tauri-plugin-thermal-printer 1.0.2. Upstream has no network
# transport on desktop, so a `tcp://host` printer went to the Windows spooler as
# a queue name and failed with os error 6. Patch adds a RAW/JetDirect socket:
# see vendor/tauri-plugin-thermal-printer/src/desktop_printers/net.rs
tauri-plugin-thermal-printer = { path = "vendor/tauri-plugin-thermal-printer" }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winspool", "winbase", "handleapi"] }

