<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Aazify POS - Advanced Point of Sale &amp; Inventory Management System</title>
    <meta name="description" content="Aazify POS is a modern, feature-rich Point of Sale and inventory management system for retail, wholesale, and cold storage businesses. FBR compliant, offline &amp; online support, billing, ledgers, and advanced business analytics." />
    <meta name="keywords" content="POS system Pakistan, Point of Sale software, retail billing system, inventory management software, FBR tax integration, ledger management, retail software, invoice printing, retail pos, wholesale pos, aazify" />
    <meta name="author" content="AAZ Solutions" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="canonical" href="https://www.aazify.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.aazify.com" />
    <meta property="og:title" content="Aazify POS - Advanced Point of Sale &amp; Inventory Management System" />
    <meta property="og:description" content="A complete point-of-sale system with inventory management, customer tracking, FBR tax compliance, and powerful business analytics." />
    <meta property="og:image" content="https://www.aazify.com/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.aazify.com" />
    <meta name="twitter:title" content="Aazify POS - Advanced Point of Sale &amp; Inventory Management System" />
    <meta name="twitter:description" content="FBR tax-compliant Point of Sale software with real-time stock alerts, ledgers, and employee payroll." />
    <meta name="twitter:image" content="https://www.aazify.com/og-image.jpg" />

    <!-- Structured Data JSON-LD (Schema.org Markup) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Aazify POS",
        "operatingSystem": "Windows, Web",
        "applicationCategory": "BusinessApplication",
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "PKR",
          "lowPrice": "35000",
          "highPrice": "50000",
          "offerCount": "2"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5.0",
          "ratingCount": "87"
        },
        "description": "A complete, secure, and compliant Point of Sale (POS) and inventory management system tailored for retail, wholesale, and distribution businesses in Pakistan. Features include billing, smart inventory, customer ledgers, and FBR tax compliance.",
        "publisher": {
          "@type": "Organization",
          "name": "AAZ Solutions",
          "url": "https://www.aazify.com"
        }
      }
    </script>
  </head>

  <body>
    <!-- Apply the saved theme before first paint, so a dark-mode user never
         sees a white flash while React boots. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('pos_theme_mode') || 'light';
          var dark = mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) { /* private mode — fall back to light */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
